name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Verify build output
        run: |
          if [ ! -d "dist" ] || [ -z "$(ls -A dist/*.rpk 2>/dev/null)" ]; then
            echo "ERROR: No RPK files found in dist/ — build likely failed silently"
            exit 1
          fi
          if [ ! -d "build" ] || [ -z "$(ls -A build/ 2>/dev/null)" ]; then
            echo "ERROR: No files found in build/ — build likely failed silently"
            exit 1
          fi
          echo "Build output verified: dist/*.rpk and build/ exist"

      - name: Sign RPK
        run: |
          if [ -n "$CERT_PEM" ] && [ -n "$KEY_PEM" ]; then
            echo "$CERT_PEM" > certificate.pem
            echo "$KEY_PEM" > private.pem
            npx aiot resign --cert certificate.pem --key private.pem dist/*.rpk
          else
            echo "Skipping sign: CERT_PEM or KEY_PEM not set"
          fi
        env:
          CERT_PEM: ${{ secrets.CERT_PEM }}
          KEY_PEM: ${{ secrets.KEY_PEM }}

      - name: Upload RPK
        uses: actions/upload-artifact@v4
        with:
          name: rpk
          path: dist/**/*.rpk
          if-no-files-found: error

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: build/
          if-no-files-found: error
