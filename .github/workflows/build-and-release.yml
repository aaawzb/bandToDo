name: 构建与预发布

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装依赖
        run: npm install
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: 编译 RPK
        run: npm run build

      - name: 查找 RPK 文件
        id: find-rpk
        run: |
          RPK=$(find build dist -name "*.rpk" -type f 2>/dev/null | head -1)
          if [ -z "$RPK" ]; then
            echo "未在构建输出中找到 .rpk 文件"
            find . -name "*.rpk" -type f 2>/dev/null || true
            find build dist release -type f 2>/dev/null || true
            exit 1
          fi
          echo "path=$RPK" >> $GITHUB_OUTPUT
          echo "name=$(basename "$RPK")" >> $GITHUB_OUTPUT

      - name: 创建预发布版本
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: v${{ github.run_number }}（预发布）
          body: |
            ## 自动构建 #${{ github.run_number }}

            - 提交：${{ github.sha }}
            - 构建时间：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            > 此为自动生成的预发布版本，用于测试。
          files: ${{ steps.find-rpk.outputs.path }}
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
