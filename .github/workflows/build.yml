name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Sign RPK
        if: ${{ secrets.CERT_PEM != '' && secrets.KEY_PEM != '' }}
        run: |
          echo "$CERT_PEM" > certificate.pem
          echo "$KEY_PEM" > private.pem
          npx aiot resign --cert certificate.pem --key private.pem dist/*.rpk
        env:
          CERT_PEM: ${{ secrets.CERT_PEM }}
          KEY_PEM: ${{ secrets.KEY_PEM }}

      - name: Upload RPK
        uses: actions/upload-artifact@v4
        with:
          name: rpk
          path: dist/**/*.rpk
          if-no-files-found: warn

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: build/
          if-no-files-found: warn
